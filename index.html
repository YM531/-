<style>
  :root{
    --bg:#14142B; --panel:#1E1E3F; --cell:#2A2A52; --cell-edge:#3A3A66;
    --amber:#FFB627; --teal:#2DD4BF; --rose:#FB7185; --text:#F5F3FF; --muted:#9A9AC0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(120% 120% at 50% 0%, #1c1c3d 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:max(env(safe-area-inset-top),12px) 14px max(env(safe-area-inset-bottom),12px);
  }
  .wrap{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;}
  header{text-align:center;flex:0 0 auto;}
  .logo{font-size:13px;letter-spacing:.32em;color:var(--muted);font-weight:600;margin:2px 0 4px;}
  .timer{
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    font-size:clamp(48px,16vw,76px);font-weight:700;line-height:1;color:var(--amber);
    font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 0 18px rgba(255,182,39,.45);
  }
  .substat{display:flex;justify-content:center;gap:18px;color:var(--muted);font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums;}
  .substat b{color:var(--text);font-weight:600;}
  .board-area{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;}
  .board{display:grid;gap:8px;width:100%;}
  .cell{
    aspect-ratio:1/1;border:none;margin:0;padding:0;cursor:pointer;
    background:linear-gradient(180deg,var(--cell) 0%,#23234a 100%);
    border-radius:14px;color:var(--text);
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-weight:700;
    font-size:clamp(18px,7vw,30px);font-variant-numeric:tabular-nums;
    box-shadow:0 2px 0 #15152e, inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .05s ease, background .15s ease, opacity .2s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .cell:active{transform:translateY(2px);box-shadow:0 0 0 #15152e;}
  .cell.done{background:#16213a;color:#3a4a66;box-shadow:none;opacity:.45;}
  .cell.wrong{animation:wrong .3s;}
  @keyframes wrong{0%,100%{background:linear-gradient(180deg,var(--cell),#23234a);}50%{background:var(--rose);color:#fff;}}
  .board.shake{animation:shake .25s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  footer{flex:0 0 auto;text-align:center;}
  .levels{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
  .lvl{
    flex:1;padding:11px 4px;border-radius:12px;border:1px solid var(--cell-edge);
    background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;line-height:1.3;
  }
  .lvl small{display:block;font-size:11px;font-weight:400;opacity:.8;}
  .lvl.sel{background:var(--panel);color:var(--text);border-color:var(--amber);}
  .btn{
    width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:700;
    background:var(--amber);color:#14142B;cursor:pointer;box-shadow:0 3px 0 #c98a13;
  }
  .btn:active{transform:translateY(2px);box-shadow:none;}
  .overlay{
    position:fixed;inset:0;background:rgba(10,10,24,.82);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:24px;z-index:10;
  }
  .overlay.show{display:flex;}
  .card{
    background:var(--panel);border:1px solid var(--cell-edge);border-radius:22px;
    padding:28px 24px;width:100%;max-width:340px;text-align:center;
  }
  .card h2{margin:0 0 4px;font-size:20px;}
  .card .big{font-family:"SF Mono",ui-monospace,monospace;font-size:54px;font-weight:700;color:var(--amber);margin:14px 0 4px;text-shadow:0 0 18px rgba(255,182,39,.4);}
  .card .nb{color:var(--teal);font-weight:600;margin:6px 0 18px;font-size:14px;min-height:18px;}
  .card .row{color:var(--muted);font-size:14px;margin-bottom:18px;}
  .card .row b{color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">TOUCH THE NUMBER</div>
    <div class="timer" id="timer">0.00</div>
    <div class="substat">
      <span>ミス <b id="miss">0</b></span>
      <span>ベスト <b id="best">--</b></span>
    </div>
  </header>
  <div class="board-area"><div class="board" id="board"></div></div>
  <footer>
    <div class="levels" id="levels">
      <button class="lvl" data-n="9">かんたん<small>3×3</small></button>
      <button class="lvl sel" data-n="25">ふつう<small>5×5</small></button>
      <button class="lvl" data-n="36">むずかしい<small>6×6</small></button>
    </div>
    <button class="btn" id="startBtn">スタート</button>
  </footer>
</div>
<div class="overlay" id="overlay">
  <div class="card">
    <h2>クリア！🎉</h2>
    <div class="big" id="resultTime">0.00</div>
    <div class="nb" id="newBest"></div>
    <div class="row">ミス <b id="resultMiss">0</b> ／ ベスト <b id="resultBest">--</b></div>
    <button class="btn" id="againBtn">もう一回</button>
  </div>
</div>
<script>
(function(){
  const boardEl=document.getElementById('board'), timerEl=document.getElementById('timer');
  const missEl=document.getElementById('miss'), bestEl=document.getElementById('best');
  const startBtn=document.getElementById('startBtn'), levelsEl=document.getElementById('levels');
  const overlay=document.getElementById('overlay'), againBtn=document.getElementById('againBtn');

  let N=25, cols=5, next=1, miss=0, startTime=0, running=false, raf=null;
  const bests={}; const mem={};
  const cellsForN=n=>({9:3,25:5,36:6}[n]);

  // ベスト保存: Claude内では window.storage、Safari/ホスティングでは localStorage を使う
  const Store={
    async get(k){
      try{ if(window.storage){ const r=await window.storage.get(k); if(r&&r.value!=null) return r.value; } }catch(e){}
      try{ const v=localStorage.getItem(k); if(v!=null) return v; }catch(e){}
      return mem[k]!=null?mem[k]:null;
    },
    async set(k,v){
      let ok=false;
      try{ if(window.storage){ await window.storage.set(k,v); ok=true; } }catch(e){}
      if(!ok){ try{ localStorage.setItem(k,v); ok=true; }catch(e){} }
      if(!ok){ mem[k]=v; }
    }
  };

  function fmt(sec){
    if(sec<60) return sec.toFixed(2);
    const m=Math.floor(sec/60); const s=(sec-m*60).toFixed(2).padStart(5,'0');
    return m+':'+s;
  }
  async function loadBest(n){ const v=await Store.get('ttn:best:'+n); if(v!=null) bests[n]=parseFloat(v); }
  async function saveBest(n,val){ await Store.set('ttn:best:'+n,String(val)); }
  function showBest(){ bestEl.textContent=bests[N]?fmt(bests[N]):'--'; }

  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function buildBoard(){
    boardEl.style.gridTemplateColumns='repeat('+cols+',1fr)';
    boardEl.innerHTML='';
    shuffle(Array.from({length:N},(_,i)=>i+1)).forEach(num=>{
      const b=document.createElement('button');
      b.className='cell'; b.textContent=num; b.dataset.num=num;
      b.addEventListener('click',()=>onTap(b,num));
      boardEl.appendChild(b);
    });
  }
  function tick(){ timerEl.textContent=fmt((performance.now()-startTime)/1000); raf=requestAnimationFrame(tick); }

  function onTap(btn,num){
    if(!running){ if(num!==1) return; running=true; startTime=performance.now(); raf=requestAnimationFrame(tick); }
    if(num===next){ btn.classList.add('done'); btn.textContent=''; next++; if(next>N) finish(); }
    else{
      miss++; missEl.textContent=miss;
      btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
      boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake');
    }
  }
  async function finish(){
    running=false; cancelAnimationFrame(raf);
    const elapsed=(performance.now()-startTime)/1000; timerEl.textContent=fmt(elapsed);
    let isBest=false;
    if(!bests[N]||elapsed<bests[N]){ bests[N]=elapsed; isBest=true; await saveBest(N,elapsed); }
    showBest();
    document.getElementById('resultTime').textContent=fmt(elapsed);
    document.getElementById('resultMiss').textContent=miss;
    document.getElementById('resultBest').textContent=fmt(bests[N]);
    document.getElementById('newBest').textContent=isBest?'★ 自己ベスト更新！':'';
    overlay.classList.add('show');
  }
  function newGame(){
    next=1; miss=0; running=false; cancelAnimationFrame(raf);
    missEl.textContent='0'; timerEl.textContent='0.00';
    overlay.classList.remove('show'); buildBoard(); showBest();
  }
  levelsEl.addEventListener('click',e=>{
    const b=e.target.closest('.lvl'); if(!b) return;
    [...levelsEl.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel');
    N=parseInt(b.dataset.n,10); cols=cellsForN(N); newGame();
  });
  startBtn.addEventListener('click',newGame);
  againBtn.addEventListener('click',newGame);
  Promise.all([loadBest(9),loadBest(25),loadBest(36)]).then(()=>{ cols=cellsForN(N); newGame(); });
})();
</script>
</body>
</html>
